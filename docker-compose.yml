services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: onepiece
      POSTGRES_PASSWORD: onepiece
      POSTGRES_DB: onepiece
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onepiece"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      POSTGRES_URL: postgres://onepiece:onepiece@db:5432/onepiece
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me-at-least-32-chars}
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_ID: ${GITHUB_ID:-}
      GITHUB_SECRET: ${GITHUB_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
